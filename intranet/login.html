<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet - Contabilidad Trango Catrilaf (CTC)</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- O tus estilos generales -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; background-color: #004080; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-login:hover { background-color: #003366; }
        .error-msg { color: #d9534f; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Intranet CTC</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario / RUT de Empresa</label>
                <input type="text" id="username" required placeholder="Ej: transportes-trango">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
            <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // Simulación de base de datos de usuarios (Esto se puede conectar a un backend o BD más adelante)
            // Aquí definimos las credenciales de prueba para cada cliente
            const usuariosValidos = {
                "trangotrans": { pass: "clave123", redirect: "dashboard.html?cliente=trangotrans" },
                "comercialxyz": { pass: "xyz2026", redirect: "dashboard.html?cliente=comercialxyz" },
                "eliseohuenchulaf": { pass: "eliseo1984", redirect: "dashboard.html?cliente=eliseohuenchulaf" },
                "granjaquecherehue": { pass: "granja2026", redirect: "dashboard.html?cliente=Granja Quecherehue" },
                "contabilidadtrangocatrilaf": { pass: "ctc", redirect: "dashboard.html?cliente=Contabilidad Trango Catrilaf" } //ultima no lleva coma
            };

            if (usuariosValidos[user] && usuariosValidos[user].pass === pass) {
                // Guardamos la sesión activa en el navegador
                localStorage.setItem("ctc_user", user);
                window.location.href = usuariosValidos[user].redirect;
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
