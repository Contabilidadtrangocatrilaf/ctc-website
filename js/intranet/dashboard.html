    // ==========================================

    // ==========================================

        categorias: {
            "iva": {
                titulo: "📁 IVA (Mensual 2026)",
                docs: [

                ]

};

const clienteData = baseDocumentos[currentUser];

if (clienteData) {
    document.getElementById("welcomeTitle").innerText = "Bienvenido, " + clienteData.nombre;
    const containerEl = document.getElementById("documentList");

    // Función que dibuja la vista principal con las 4 carpetas
    function mostrarCarpetas() {
        let html = `<h3 style="margin-bottom: 20px; color: #444;">Carpetas de Documentos</h3>`;
        html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;">`;

        for (let claveCat in clienteData.categorias) {
            let categoria = clienteData.categorias[claveCat];
            // Cada tarjeta de carpeta tiene un evento onclick que llama a la función para abrirla
            html += `
                <div onclick="abrirCarpeta('${claveCat}')" style="background: #fdfdfd; border: 2px solid #e0e0e0; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05);" onmouseover="this.style.borderColor='#007bff'; this.style.transform='translateY(-2px)';" onmouseout="this.style.borderColor='#e0e0e0'; this.style.transform='translateY(0)';">
                    <div style="font-size: 40px; margin-bottom: 10px;">📁</div>
                    <div style="font-weight: bold; color: #333; font-size: 16px;">${categoria.titulo.replace('📁 ', '')}</div>
                    <div style="font-size: 12px; color: #777; margin-top: 5px;">${categoria.docs.length} archivo(s)</div>
                </div>
            `;
        }
        html += `</div>`;
        containerEl.innerHTML = html;
    }

    // Función que se ejecuta al hacer clic en una carpeta para ver sus archivos
    window.abrirCarpeta = function(claveCat) {
        let categoria = clienteData.categorias[claveCat];
        
        let html = `
            <button onclick="mostrarCarpetas()" style="background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold;">
                ⬅ Volver a Carpetas
            </button>
            <h3 style="margin-bottom: 15px; color: #333;">${categoria.titulo}</h3>
            <ul style="list-style: none; padding: 0;">
        `;

        if (categoria.docs.length === 0) {
            html += `<p style="color: #666; font-style: italic;">No hay documentos en esta carpeta.</p>`;
        } else {
            categoria.docs.forEach(doc => {
                html += `
                    <li style="margin: 10px 0; display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 12px 15px; border-radius: 6px; border: 1px solid #eee;">
                        <span style="font-weight: 500; color: #333;">📄 ${doc.titulo}</span>
                        <a href="${doc.url}" target="_blank" style="text-decoration: none; background: #007bff; color: white; padding: 6px 14px; border-radius: 4px; font-size: 14px; font-weight: bold;">Ver PDF</a>
                    </li>
                `;
            });
        }

        html += `</ul>`;
        containerEl.innerHTML = html;
    };

    // Al cargar la página, mostramos la vista de carpetas inicial
    mostrarCarpetas();
}

function logout() {
    localStorage.removeItem("ctc_user");
    window.location.href = "login.html";
}
